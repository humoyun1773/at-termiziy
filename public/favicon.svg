<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded squircle background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
  
  <!-- Modern Graduation Cap Symbol with high contrast -->
  <g filter="url(#shadow)">
    <!-- Main Diamond Cap Top -->
    <path d="M256 120 L440 216 L256 312 L72 216 Z" fill="#ffffff" stroke="rgba(255,255,255,0.9)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Cap Lower Skullcap -->
    <path d="M144 260 V332 C144 380 200 408 256 408 C312 408 368 380 368 332 V260 L256 320 Z" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Golden Ribbon Tassel -->
    <path d="M400 240 V340 C400 354 416 364 424 374 C428 380 428 388 424 394 C420 400 410 404 402 404 C394 404 384 400 380 394 C376 388 376 380 380 374 C388 364 404 354 404 340 V240" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Cap Button Top -->
    <circle cx="256" cy="216" r="14" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Modern 4-Stars representing 4 Languages -->
  <g fill="url(#goldGrad)">
    <circle cx="204" cy="440" r="8"/>
    <circle cx="238" cy="446" r="9"/>
    <circle cx="274" cy="446" r="9"/>
    <circle cx="308" cy="440" r="8"/>
  </g>
</svg>